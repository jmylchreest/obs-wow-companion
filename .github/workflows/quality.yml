name: Quality
on:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: ./.github/actions/build-environment
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - uses: ./.github/actions/cargo-tool
        with:
          package: cargo-nextest
          executable: cargo-nextest
          version: "0.9.149"
      - run: cargo nextest run --workspace --locked --profile ci
      - name: Isolated Linux password store
        if: runner.os == 'Linux'
        run: python3 scripts/credential-smoke.py
      - name: Windows password store
        if: runner.os == 'Windows'
        env:
          OWC_TEST_PRIVATE_KEYRING: "1"
        run: cargo test -p owc-app --locked credentials::tests::system_store_round_trip -- --ignored
      - run: cargo test --workspace --doc --locked
      - run: python scripts/check-docs.py
      - name: Parser benchmark
        if: runner.os == 'Linux'
        run: cargo bench -p owc-wow-log --bench ingestion --locked
      - name: Test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: tests-${{ runner.os }}
          path: |
            target/nextest/ci/junit.xml
            target/criterion
          retention-days: 14
  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python3 -m pip install PyYAML==6.0.3
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: ./.github/actions/cargo-tool
        with:
          package: cargo-deny
          executable: cargo-deny
          version: "0.20.2"
      - run: cargo deny check
      - name: Verify dependency notices
        run: |
          python3 scripts/third-party-notices.py
          git diff --exit-code -- THIRD-PARTY-NOTICES.txt
      - name: Lint workflows and publication gates
        run: |
          python3 scripts/ci-tools.py actionlint
          python3 -m unittest discover -s scripts -p 'test_ci*.py'
      - run: python3 scripts/check-docs.py
