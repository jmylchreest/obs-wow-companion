name: Quality
on:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/build-environment
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - uses: ./.github/actions/cargo-tool
        with:
          package: cargo-nextest
          executable: cargo-nextest
          version: "0.9.150"
      - run: cargo nextest run --workspace --all-features --locked --profile ci
      - name: Isolated Linux password store
        if: runner.os == 'Linux'
        run: python3 scripts/credential-smoke.py
      - name: Windows password store
        if: runner.os == 'Windows'
        env:
          OWC_TEST_PRIVATE_KEYRING: "1"
        run: cargo test -p owc-app --locked credentials::tests::system_store_round_trip -- --ignored
      - name: Media tool discovery and execution
        run: python scripts/media-tools-smoke.py
      - name: macOS service and crash recovery
        if: runner.os == 'macOS'
        run: |
          cargo build -p owc-app --locked
          python scripts/service-smoke.py
          python scripts/recovery-smoke.py
      - run: cargo test --workspace --doc --locked
      - run: python scripts/check-docs.py
      - name: Parser benchmark
        if: runner.os == 'Linux'
        run: |
          cargo bench -p owc-wow-log --bench ingestion --locked
          cargo bench -p owc-library --bench library --locked
      - name: GLib security regression (optimised)
        if: runner.os == 'Linux'
        run: cargo test -p owc-app --release --no-default-features --test glib_variant --locked
      - name: Profiling service fixture
        if: runner.os == 'Linux'
        env:
          OWC_TEST_PROFILING: "1"
        run: |
          cargo build -p owc-app --features profiling --locked
          python3 scripts/service-smoke.py
      - name: Test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: tests-${{ runner.os }}
          path: |
            target/nextest/ci/junit.xml
            target/criterion
            target/media-tools-report.json
          retention-days: 14
  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python3 -m pip install -r scripts/requirements-ci.txt
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: ./.github/actions/cargo-tool
        with:
          package: cargo-deny
          executable: cargo-deny
          version: "0.20.2"
      - run: cargo deny check
      - name: Verify dependency notices
        run: |
          python3 scripts/third-party-notices.py
          git diff --exit-code -- THIRD-PARTY-NOTICES.txt
      - name: Generated notices for dependency reviews
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: dependency-notices
          path: THIRD-PARTY-NOTICES.txt
          retention-days: 14
      - name: Lint workflows and publication gates
        run: |
          python3 scripts/ci-tools.py actionlint
          python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: python3 scripts/check-docs.py
      - name: Check shared aide decisions
        run: python3 scripts/shared-context.py check
