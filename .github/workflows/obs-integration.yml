name: OBS integration
on:
  workflow_dispatch:
  schedule:
    - cron: '41 6 * * 1'
permissions:
  contents: read
concurrency:
  group: obs-integration-${{ github.ref }}
  cancel-in-progress: true
jobs:
  obs:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: ./.github/actions/build-environment
      - name: Install OBS from its official Ubuntu PPA
        run: |
          sudo add-apt-repository -y ppa:obsproject/obs-studio
          sudo apt-get update
          sudo apt-get install -y obs-studio
          mkdir -p target/ci-evidence
          obs --version > target/ci-evidence/obs-version.txt
      - uses: ./.github/actions/cargo-tool
        with:
          package: cargo-nextest
          executable: cargo-nextest
          version: "0.9.149"
      - run: cargo build --example obs_probe --bin obs-wow-companion --locked
      - name: Private OBS recording, splitting and encounter exports
        env:
          OWC_BROWSER_SETUP_TEST: "1"
          OWC_RECONNECT_TEST: "1"
        run: python3 scripts/private-session.py python3 scripts/isolated-obs.py
      - name: Collect evidence
        if: always()
        run: python3 scripts/ci-tools.py evidence
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: obs-integration
          path: target/ci-evidence
          retention-days: 14
