name: Maintenance audit
run-name: ${{ inputs.fallback_of && format('fallback:{0}', inputs.fallback_of) || github.workflow }}
on:
  workflow_dispatch:
    inputs:
      backend:
        description: Runner backend
        type: choice
        options: [hosted, arc]
        default: hosted
      source_sha:
        description: Exact source commit supplied by the fallback router
        type: string
      fallback_of:
        description: Parent run ID supplied by the fallback router
        type: string
  schedule:
    - cron: '41 6 * * 1'
permissions:
  contents: read
jobs:
  audit:
    if: ${{ !inputs.source_sha || inputs.source_sha == github.workflow_sha }}
    runs-on: ${{ github.event_name != 'pull_request' && inputs.backend == 'arc' && 'obs-wow-companion-linux' || 'ubuntu-24.04' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - run: python3 scripts/maintenance-audit.py
