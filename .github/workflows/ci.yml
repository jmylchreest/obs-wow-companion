name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 5 * * 1'
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    uses: ./.github/workflows/quality.yml
  packages:
    needs: quality
    uses: ./.github/workflows/packages.yml
  complete:
    name: CI complete
    if: always()
    needs: [quality, packages]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every verification job
        env:
          QUALITY: ${{ needs.quality.result }}
          PACKAGES: ${{ needs.packages.result }}
        run: test "$QUALITY" = success && test "$PACKAGES" = success
