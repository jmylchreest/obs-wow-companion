name: Prepare release PR
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-pr
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: ./.github/actions/cargo-tool
        with:
          package: release-plz
          executable: release-plz
          version: "0.4.1"
      - name: Prepare version and changelog PR only
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PR_TOKEN || secrets.GITHUB_TOKEN }}
        run: release-plz release-pr
