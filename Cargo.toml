[workspace]
members = ["crates/domain", "crates/wow-log", "crates/obs-client", "crates/capture", "crates/media", "crates/library", "crates/app"]
resolver = "3"

[workspace.package]
version = "0.1.0-dev.1"
edition = "2024"
rust-version = "1.95"
license = "MIT"
publish = false
repository = "https://github.com/jmylchreest/obs-wow-companion"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
base64 = "0.22"
sha2 = "0.10"
futures-util = "0.3"
tokio-tungstenite = "0.28"
rusqlite = { version = "0.38", features = ["bundled"] }
axum = "0.8"
wry = "0.53"
tao = "0.34"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs", "limit"] }
clap = { version = "4", features = ["derive"] }
tempfile = "3"
proptest = "1.12.0"
criterion = "0.8.2"
file-id = "0.2.3"
fs2 = "0.4"
directories-next = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.release]
lto = "thin"
strip = true

[profile.dist]
inherits = "release"
lto = "thin"
