[workspace]
exclude = ["vendor/glib"]
members = ["crates/domain", "crates/wow-log", "crates/obs-client", "crates/capture", "crates/media", "crates/library", "crates/app"]
resolver = "3"

[workspace.package]
version = "0.1.0-dev.1"
edition = "2024"
rust-version = "1.95"
license = "MIT"
publish = false
repository = "https://github.com/jmylchreest/obs-wow-companion"

[workspace.dependencies]
anyhow = "1.0.104"
thiserror = "2.0.21"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
chrono = { version = "0.4.45", features = ["serde"] }
uuid = { version = "1.29.0", features = ["v4", "serde"] }
base64 = "0.23.1"
sha2 = "0.11.1"
futures-util = "0.3.34"
tokio-tungstenite = "0.30.0"
rusqlite = { version = "0.41.0", features = ["bundled"] }
axum = "0.8.9"
wry = "0.57.1"
tao = "0.37.2"
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["fs", "limit"] }
clap = { version = "4.6.7", features = ["derive"] }
tempfile = "3.27.0"
proptest = "1.12.0"
criterion = "0.8.2"
file-id = "0.2.3"
fs2 = "0.4.3"
directories-next = "2.0.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.release]
lto = "thin"
strip = true

[profile.dist]
inherits = "release"
lto = "thin"

# Keep symbols for sampling profilers without changing release packaging.
[profile.profiling]
inherits = "release"
debug = 2
strip = false

[patch.crates-io]
# GTK3 still requires 0.18; retain the upstream unsoundness fix until it can move.
glib = { path = "vendor/glib" }
